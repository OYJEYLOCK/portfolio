name: Deploy portfolio

on:
  push:
    branches: [main]
    paths:
      - portfolio-site.zip
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          python3 - <<'PY'
          import pathlib
          import zipfile
          with zipfile.ZipFile("portfolio-site.zip") as archive:
              for entry in archive.infolist():
                  normalized = entry.filename.replace("\\", "/")
                  parts = normalized.split("/")
                  target = pathlib.Path("_site", *parts)
                  if normalized.endswith("/"):
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(archive.read(entry))

          # GitHub project pages are served from /<repository>/, while the
          # static export uses root-relative URLs by default. Prefix any
          # unadjusted HTML URLs so styles and media resolve on Pages.
          repository = "${{ github.event.repository.name }}"
          prefix = f"/{repository}/"
          for target in pathlib.Path("_site").rglob("*.html"):
              html = target.read_text(encoding="utf-8")
              html = html.replace('"/', f'"{prefix}')
              html = html.replace(f'"{prefix}{repository}/', f'"{prefix}')
              target.write_text(html, encoding="utf-8")
          PY
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
